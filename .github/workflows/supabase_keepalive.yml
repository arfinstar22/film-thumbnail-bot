name: Supabase Anti-Pause Keepalive

on:
  schedule:
    # Runs at 02:00 UTC every 3 days (Aman dari batas 7 hari jeda Supabase Free Tier)
    - cron: '0 2 */3 * *'
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual kapan saja dari GitHub

jobs:
  keepalive:
    name: Ping Supabase Database & REST API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Execute Supabase Keepalive
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
        run: |
          python scripts/keepalive.py
